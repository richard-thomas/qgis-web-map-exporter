<!-- Template for loading a web map from the 'Web Map Exporter' QGIS plugin
     Note: The hosting server MUST support HTTP Range Requests and CORS.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Map Viewer</title>

    <link rel="stylesheet" href="https://unpkg.com/ol@10.9.0/ol.css" type="text/css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol-layerswitcher@4.1.2/dist/ol-layerswitcher.css" />

    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        .ol-grayscale {
            filter: grayscale(100%);
        }
        .ol-mouse-position {
            bottom: 8px;
            top: auto;
            left: 8px;
        }
        .ol-mouse-position::before {
            content: "Long, Lat (EPSG:4326): ";
            font-weight: bold;
            color: #333;
        }
        .ol-zoomslider {
            top: 6.5em;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- OpenLayers Core Library -->
    <!-- Use OL9.x as olpmtiles.js has a problem with OL10, but only when using <script> -->
    <script src="https://unpkg.com/ol@9.2.4/dist/ol.js"></script>
<!--
    <script src="https://unpkg.com/ol@10.9.0/dist/ol.js"></script>
-->
    <!-- FlatGeobuf OpenLayers-specific Library -->
    <script src="https://unpkg.com/flatgeobuf@4.4.0/dist/flatgeobuf-ol.min.js"></script>

    <!-- PMTiles OpenLayers-specific Library -->
    <script src="https://unpkg.com/ol-pmtiles@2.0.2/dist/olpmtiles.js"></script>

    <!-- SLDReader SLD to OpenLayers style converter -->
    <script src="https://cdn.jsdelivr.net/npm/@nieuwlandgeo/sldreader@latest/dist/sldreader-standalone.min.js"></script>

    <!-- Legend/Layer Switcher UI -->
    <script src="https://cdn.jsdelivr.net/npm/ol-layerswitcher@4.1.2/dist/ol-layerswitcher.js"></script>

    <!-- Proj4JS only required if targeting a CRS that is not built in (i.e. not 4326/3857) -->
    <script src="https://cdn.jsdelivr.net/npm/proj4/dist/proj4.js"></script>

    <!-- Web Map Configuration defines layers and map user-customizations -->
    <script src="map_config.js"></script>

    <script type="module" src="web_map_viewer.js"></script>
</body>
</html>
